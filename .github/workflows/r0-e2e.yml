# R0 独立自动化复验（A 的 11 项场景 + C 的 228 条控件 + B 的分类映射回归）
#
# 与 ci.yml 的分工：
#   · ci.yml      —— "退出码即结论"的构建/静态检查/单测/全仓 race/容器冒烟；
#   · r0-e2e.yml  —— 需要真实浏览器与服务进程的运行时验收（本文件）。
#
# 关键约束（对应任务单 §二）：
#   1. 干净环境启动，不依赖任何本机状态；实例用临时 SQLite + 随机端口 + 每次新生成的 JWT 密钥；
#   2. 合成账号与合成数据，不使用生产凭证/生产库；
#   3. 仅上传白名单证据（日志/截图/报告/校验和）；含网络明文的压缩归档一律不上传，
#      且上传前必须通过 tools/r0/e2e/scripts/scan-artifacts.js 的失败关闭扫描。
name: R0 E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r0-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: A(11 场景) + D(缺陷回归) + C(228 控件) + B(分类审计)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: server/go.sum

      - name: 构建服务二进制（CGO 真库）
        working-directory: server
        run: |
          go version
          gcc --version | head -1
          go build -o fastledger ./cmd/server
          ls -l fastledger

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Playwright（含 chromium）
        working-directory: tools/r0/e2e
        run: |
          npm ci
          npm i --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          node -e "console.log('playwright ok:', require('playwright/package.json').version)"

      - name: 分类解析合成测试（B 的补充整改）
        run: node --test tools/r0/test-resolve-category.js

      # P1 安全整改（K1-K3）：凭据扫描器负向合成测试门禁。
      # 30 项用例覆盖 K1(UTF-16LE/BE/NUL插入/无法解码) / K2(短Token/短Key/短密码/业务字段不误报)
      # / K3(x-api-key/apiKey变体/Base64/JSON嵌套/大小写分隔符)，全部合成凭据、真实断言。
      # 任一失败即 job 失败，确保绕过无法再通过。
      - name: 凭据扫描器负向合成测试（K1-K3，30 项）
        run: node --test tools/r0/e2e/test-scan-artifacts.js

      - name: 分类映射回归审计（B · 22 笔）
        env:
          R0_SERVER_BIN: ${{ github.workspace }}/server/fastledger
        run: node tools/r0/e2e/scripts/reseed-audit.js

      # A 是门禁：任一项 FAIL 或 BLOCKED 都让 job 失败
      - name: 包 A · 11 项状态/权限/同步场景
        id: a_suite
        working-directory: tools/r0/e2e
        env:
          R0_SERVER_BIN: ${{ github.workspace }}/server/fastledger
          R0_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/r0-e2e
        run: node run.js --suite a

      # D 是四项已确认业务缺陷的回归门禁：任一断言失败即 job 失败。
      # 与 C 的报告型定位严格区分，避免把「已知产品缺口」误读成回归通过。
      - name: 包 D · 四项业务缺陷回归（门禁）
        id: d_defects
        working-directory: tools/r0/e2e
        env:
          R0_SERVER_BIN: ${{ github.workspace }}/server/fastledger
          R0_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/r0-e2e
        run: node run.js --suite d

      # C 是报告型：允许存在已知产品缺口（PASS/FAIL 分布本身就是结论），
      # 因此单独一步且 continue-on-error，避免"产品有缺口 =流水线红"掩盖其它信号。
      - name: 包 C · 228 条逐控件运行时验收（报告型）
        id: c_controls
        continue-on-error: true
        working-directory: tools/r0/e2e
        env:
          R0_SERVER_BIN: ${{ github.workspace }}/server/fastledger
          R0_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/r0-e2e
        run: node run.js --suite c

      - name: 汇总退出码
        if: always()
        run: |
          {
            echo "## R0 E2E 结果"
            echo ""
            echo "- commit: ${{ github.sha }}"
            echo "- 包 A 退出码: ${{ steps.a_suite.outcome }}"
            echo "- 包 D 退出码（四项缺陷回归门禁）: ${{ steps.d_defects.outcome }}"
            echo "- 包 C 退出码（报告型，success 不代表无 FAIL）: ${{ steps.c_controls.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # P1 安全整改：先把证据收敛到白名单副本，再扫描；扫描不通过绝不上传。
      # prepare 用 always()，保证 A/D 门禁失败或 C 报告型 FAIL 时仍能留下报告证据。
      - name: 准备上传证据（白名单）
        id: artifact_prepare
        if: ${{ always() }}
        run: node tools/r0/e2e/scripts/prepare-upload.js --source artifacts/r0-e2e --dest artifacts/r0-e2e-upload

      # 失败关闭闸门：命中黑名单文件名或疑似凭据即以退出码 2 失败。
      # prepare 未成功时本 step 被跳过，outcome=skipped，同样不会触发上传。
      - name: 上传前安全扫描（失败即阻断）
        id: artifact_scan
        if: ${{ always() && steps.artifact_prepare.outcome == 'success' }}
        run: node tools/r0/e2e/scripts/scan-artifacts.js artifacts/r0-e2e-upload

      # P1 安全整改（K1-K3）失败关闭集成验证：用合成凭据样本直接证明
      # 「扫描失败/命中 → 退出码非 0 → 上传 step 的 if: outcome==success 不触发 → 不上传」。
      # 与上面 artifact_scan 共用同一把扫描器，因此本步是上传闸门的前置可行性证据。
      - name: 失败关闭（fail-closed）集成验证
        id: fail_closed_check
        if: ${{ always() }}
        run: |
          set -euo pipefail
          SCANNER="tools/r0/e2e/scripts/scan-artifacts.js"

          # 含合成凭据的样本（x-api-key + 一段 UTF-16LE Bearer），须被阻断。
          CRED_DIR="$(mktemp -d)"
          printf 'x-api-key: SYNTHETIC-FAKE-FC-KEY-000000000000\n' > "$CRED_DIR/leak.txt"
          printf 'Bearer %s' 'SYNTHETICFAKEUTF16LE000000000000' | iconv -t UTF-16LE > "$CRED_DIR/leak16.txt" || \
            printf 'Bearer SYNTHETICFAKEUTF16LE000000000000' > "$CRED_DIR/leak16.txt"
          set +e
          node "$SCANNER" "$CRED_DIR"; CRED_RC=$?
          set -e
          if [ "$CRED_RC" -eq 0 ]; then
            echo "::error::FAIL-OPEN: 含凭据样本竟被判定 CLEAN (rc=0)，上传闸门失效"
            exit 1
          fi
          echo "FAIL-CLOSED OK: 含凭据样本被阻断 (rc=$CRED_RC)，上传 step 的 if: outcome==success 不会触发"

          # 干净样本，须放行（rc=0）。
          CLEAN_DIR="$(mktemp -d)"
          printf 'unit: kg\nnote: groceries\nstatus: ok\n' > "$CLEAN_DIR/biz.json"
          set +e
          node "$SCANNER" "$CLEAN_DIR"; CLEAN_RC=$?
          set -e
          if [ "$CLEAN_RC" -ne 0 ]; then
            echo "::error::干净样本被误阻断 (rc=$CLEAN_RC)"
            exit 1
          fi
          echo "CLEAN OK: 干净样本放行 (rc=0)"
          rm -rf "$CRED_DIR" "$CLEAN_DIR"

      # 关键：上传只在扫描 step 的 outcome 为 success 时发生。
      # 原先的 if: always() 会让"扫描失败即退出"的防护完全失效，故必须改为依赖 outcome。
      - name: 上传证据（日志/截图/报告/校验和）
        id: artifact_upload
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: r0-e2e-evidence-${{ github.sha }}
          path: |
            artifacts/r0-e2e-upload/**
          retention-days: 30
          if-no-files-found: error

      # P1 Round 2：把证据上传链路结论写入 CI summary。
      # 既有「汇总退出码」step 一字未改；本 step 为独立新增且置于上传 step 之后，
      # 因此能读到三个新 step 的 outcome，避免绿色 CI 被误读为证据已安全上传。
      - name: 汇总证据上传安全结论
        id: artifact_upload_summary
        if: ${{ always() }}
        run: |
          {
            echo "## R0 E2E 证据上传安全结论"
            echo ""
            echo "- 白名单准备 outcome: ${{ steps.artifact_prepare.outcome }}"
            echo "- 上传前安全扫描 outcome: ${{ steps.artifact_scan.outcome }}"
            echo "- 失败关闭集成验证 outcome: ${{ steps.fail_closed_check.outcome }}"
            echo "- 上传证据 outcome: ${{ steps.artifact_upload.outcome }}"
            echo "- 扫描通过且允许上传: ${{ steps.artifact_scan.outcome == 'success' }}"
            if [ "${{ steps.artifact_upload.outcome }}" != "success" ]; then
              echo "- 上传被跳过或未成功：本轮无公开 artifact 产出，请勿把绿色 CI 解读为证据已安全上传"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
