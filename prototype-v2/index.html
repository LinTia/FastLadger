<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FastLedger · 设计规范示范原型 v2</title>
<!--
  FastLedger 新版可交互原型（依 docs/FastLedger-Web设计规范.md 构建）
  单文件自包含 · 零外部请求 · 演示数据存 localStorage（键 fl_v2_state）
  运行：直接双击打开，或 python3 -m http.server 后访问本目录
-->
<style>
/* ============ 设计 Token（docs/FastLedger-Web设计规范.md §2–§7） ============ */
:root {
  --background:#f9f8f5; --foreground:#1f2e26;
  --card:#ffffff; --card-foreground:#1f2e26;
  --primary:#34b262; --primary-hover:#2fa257; --primary-foreground:#fff;
  --secondary:#eaf6ee; --secondary-foreground:#288a4c;
  --muted:#f2f8f4; --muted-foreground:#758a80;
  --border:#e3e8e6; --input:#e3e8e6; --ring:#34b262;
  --destructive:#ef4343; --destructive-hover:#e03535;
  --success:#31a545; --warning:#ed6e0c; --info:#2463eb;
  --income:#34b262; --expense:#ef4343; --transfer:#758a80;
  --chart-1:#34b262; --chart-2:#34b2a1; --chart-3:#3484b2; --chart-4:#3444b2; --chart-5:#6234b2;
  --radius:8px; --radius-lg:12px; --radius-xl:14px; --radius-full:999px;
  --shadow-sm:0 2px 12px 0 rgba(0,0,0,.02);
  --shadow-md:0 2px 12px 0 rgba(0,0,0,.05), 0 2px 4px -1px rgba(0,0,0,.05);
  --shadow-lg:0 2px 12px 0 rgba(0,0,0,.05), 0 8px 10px -1px rgba(0,0,0,.05);
  --ease:cubic-bezier(.4,0,.2,1);
  --font-sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; font:15px/1.55 var(--font-sans); background:var(--background); color:var(--foreground);
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.hidden { display:none !important; }
button { font:inherit; }

/* ============ 顶部导航（桌面 ≥640px）/ 底部 Tab（移动） ============ */
#topbar {
  display:flex; align-items:center; gap:16px; padding:10px 20px;
  background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20; box-shadow:var(--shadow-sm);
}
#topbar .brand { font-weight:700; color:var(--primary); letter-spacing:.01em; cursor:pointer; }
#topbar nav { display:flex; gap:6px; flex:1; }
#topbar nav a {
  color:var(--muted-foreground); text-decoration:none; padding:6px 12px; border-radius:var(--radius-full);
  font-size:14px; font-weight:500; white-space:nowrap;
  transition:background .15s var(--ease), color .15s var(--ease);
}
#topbar nav a:hover { background:var(--muted); color:var(--foreground); }
#topbar nav a.active { background:var(--secondary); color:var(--primary); }
#whoami { color:var(--muted-foreground); font-size:13px; }

/* 底部 Tab：仅移动端显示 */
#tabbar {
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:20;
  background:var(--card); border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
#tabbar .tabs { display:flex; align-items:center; justify-content:space-around; }
#tabbar a {
  display:flex; flex-direction:column; align-items:center; gap:2px; text-decoration:none;
  color:var(--muted-foreground); font-size:11px; padding:4px 14px; border-radius:var(--radius);
  transition:color .15s var(--ease), background .15s var(--ease);
}
#tabbar a .ico { font-size:20px; line-height:1.2; }
#tabbar a.active { color:var(--primary); }
#tabbar a.fab-slot .fab {
  width:48px; height:48px; border-radius:var(--radius-full); background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:24px; margin-top:-20px;
  box-shadow:var(--shadow-md); transition:background .15s var(--ease), transform .1s var(--ease);
}
#tabbar a.fab-slot:active .fab { transform:scale(.95); }
#tabbar a.fab-slot.active .fab { background:var(--primary-hover); }

main { max-width:980px; margin:20px auto 90px; padding:0 16px; }
.page-title { font-size:20px; font-weight:600; margin:4px 0 14px; }

/* ============ 卡片 ============ */
.card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px; margin-bottom:16px; box-shadow:var(--shadow-sm);
  animation:fadeUp .22s var(--ease) both;
}
.card h2 { margin:0 0 12px; font-size:18px; font-weight:600; }
.card h2 .sub { font-size:12px; font-weight:400; color:var(--muted-foreground); margin-left:8px; }
.overview { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.ov-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; box-shadow:var(--shadow-sm); animation:fadeUp .22s var(--ease) both; }
.ov-card .label { font-size:13px; color:var(--muted-foreground); }
.ov-card .num { font-size:22px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
.ov-card .num small { font-size:13px; font-weight:500; color:var(--muted-foreground); }

/* ============ 按钮 ============ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-weight:500; padding:7px 16px; border-radius:var(--radius); cursor:pointer;
  border:1px solid var(--primary); background:var(--primary); color:var(--primary-foreground);
  transition:background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease);
}
.btn:hover:not(:disabled) { background:var(--primary-hover); border-color:var(--primary-hover); }
.btn:active:not(:disabled) { transform:scale(.98); }
.btn.ghost { background:transparent; color:var(--foreground); border-color:var(--border); }
.btn.ghost:hover:not(:disabled) { background:var(--muted); }
.btn.danger { background:var(--destructive); border-color:var(--destructive); }
.btn.danger:hover:not(:disabled) { background:var(--destructive-hover); border-color:var(--destructive-hover); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.block { width:100%; padding:10px 16px; }
.btn:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [role="switch"]:focus-visible {
  outline:2px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset:2px;
}
.spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; }

/* ============ 表单 ============ */
.field { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
.field > label { font-size:13px; color:var(--muted-foreground); }
input[type=text], input[type=password], input[type=number], input[type=date], select {
  font:inherit; padding:7px 10px; border:1px solid var(--input); border-radius:var(--radius);
  background:#fff; color:var(--foreground); width:100%;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
input:hover, select:hover { border-color:#cbd5e1; }
input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); outline:none; }
input.invalid, select.invalid { border-color:var(--destructive); }
.err-msg { font-size:12px; color:var(--destructive); min-height:0; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.money-input { position:relative; }
.money-input input { padding-right:28px; font-variant-numeric:tabular-nums; }
.money-input::after { content:"¥"; position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--muted-foreground); }

/* 分段切换（支出/收入/转账） */
.seg { display:flex; background:var(--muted); border-radius:var(--radius); padding:3px; gap:3px; margin-bottom:14px; }
.seg button {
  flex:1; border:0; background:transparent; color:var(--muted-foreground); padding:7px 0;
  border-radius:6px; font-weight:500; cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease);
}
.seg button.on { background:#fff; color:var(--primary); box-shadow:var(--shadow-sm); font-weight:600; }
.seg button.on.t-expense { color:var(--expense); }
.seg button.on.t-income { color:var(--income); }
.seg button.on.t-transfer { color:var(--transfer); }

/* ============ 交易列表 ============ */
.day-head { display:flex; justify-content:space-between; font-size:13px; color:var(--muted-foreground); padding:10px 4px 6px; }
.tx-row {
  display:flex; align-items:center; gap:12px; padding:11px 6px; cursor:pointer; border-radius:var(--radius);
  transition:background .12s var(--ease); min-height:44px;
}
.tx-row:hover { background:color-mix(in srgb, var(--muted) 60%, transparent); }
.tx-row:active { background:var(--muted); }
.cat-ico { width:32px; height:32px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.tx-main { flex:1; min-width:0; }
.tx-title { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-sub { font-size:12px; color:var(--muted-foreground); }
.tx-amount { font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
.tx-amount.income { color:var(--income); }
.tx-amount.expense { color:var(--expense); }
.tx-amount.transfer { color:var(--transfer); }

/* 徽标 */
.badge { display:inline-block; padding:1px 8px; border-radius:var(--radius-full); font-size:12px; line-height:1.6; background:var(--muted); color:var(--muted-foreground); }
.badge.income { background:color-mix(in srgb, var(--income) 12%, #fff); color:var(--income); }
.badge.expense { background:color-mix(in srgb, var(--expense) 10%, #fff); color:var(--expense); }
.badge.warn { background:color-mix(in srgb, var(--warning) 12%, #fff); color:var(--warning); }
.badge.over { background:color-mix(in srgb, var(--destructive) 10%, #fff); color:var(--destructive); }
.badge.role-owner { background:color-mix(in srgb, var(--primary) 14%, #fff); color:var(--secondary-foreground); }
.badge.role-admin { background:color-mix(in srgb, var(--info) 10%, #fff); color:var(--info); }

/* 筛选 chips */
.chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.chip {
  border:1px solid var(--border); background:#fff; color:var(--muted-foreground); padding:4px 14px;
  border-radius:var(--radius-full); font-size:13px; cursor:pointer;
  transition:all .15s var(--ease);
}
.chip:hover { border-color:var(--primary); color:var(--primary); }
.chip.on { background:var(--secondary); border-color:var(--secondary); color:var(--secondary-foreground); font-weight:500; }

/* ============ 进度条（预算三态） ============ */
.progress { height:8px; background:var(--muted); border-radius:var(--radius-full); overflow:hidden; }
.progress > i { display:block; height:100%; border-radius:var(--radius-full); background:var(--primary); transition:width .4s var(--ease); }
.progress > i.warn { background:var(--warning); }
.progress > i.over { background:var(--destructive); }
.budget-row { padding:12px 0; border-bottom:1px solid var(--border); }
.budget-row:last-child { border-bottom:0; }
.budget-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.budget-head .name { font-weight:500; }
.budget-head .amt { margin-left:auto; font-size:13px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }

/* ============ 报表 ============ */
.report-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.bars { display:flex; align-items:flex-end; gap:12px; height:180px; padding:8px 4px 0; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.bar-pair { display:flex; gap:3px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
.bar { width:16px; border-radius:4px 4px 0 0; background:var(--chart-1); transition:height .4s var(--ease); min-height:2px; }
.bar.in { background:var(--chart-3); }
.bar-x { font-size:11px; color:var(--muted-foreground); }
.donut-wrap { display:flex; align-items:center; gap:16px; }
.donut { width:150px; height:150px; border-radius:50%; position:relative; flex-shrink:0; }
.donut::after { content:""; position:absolute; inset:32px; background:#fff; border-radius:50%; }
.legend { flex:1; min-width:0; }
.legend .li { display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; }
.legend .dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.legend .v { margin-left:auto; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
.month-nav { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.month-nav button { border:1px solid var(--border); background:#fff; border-radius:var(--radius); width:30px; height:30px; cursor:pointer; color:var(--muted-foreground); transition:all .15s var(--ease); }
.month-nav button:hover { border-color:var(--primary); color:var(--primary); }

/* ============ 菜单（我的） ============ */
.menu a {
  display:flex; align-items:center; gap:12px; padding:13px 10px; text-decoration:none; color:var(--foreground);
  border-bottom:1px solid var(--border); border-radius:var(--radius); transition:background .12s var(--ease); min-height:44px;
}
.menu a:hover { background:var(--muted); }
.menu a:active { background:color-mix(in srgb, var(--muted) 80%, transparent); }
.menu a:last-child { border-bottom:0; }
.menu .m-ico { width:32px; height:32px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:16px; }
.menu .arrow { margin-left:auto; color:var(--muted-foreground); }

/* 开关 */
.switch { position:relative; width:40px; height:22px; border-radius:var(--radius-full); background:var(--neutral-300,#dee0e3); border:0; cursor:pointer; transition:background .15s var(--ease); flex-shrink:0; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .15s var(--ease); }
.switch[aria-checked="true"] { background:var(--primary); }
.switch[aria-checked="true"]::after { left:20px; }
.privacy-note {
  display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--muted-foreground);
  background:var(--muted); border-radius:var(--radius); padding:8px 10px; margin-top:8px;
}

/* ============ 对话框 ============ */
dialog {
  border:1px solid var(--border); border-radius:var(--radius-xl); padding:20px; min-width:320px; max-width:92vw;
  background:var(--card); color:var(--foreground); box-shadow:var(--shadow-lg);
  animation:dialogIn .18s var(--ease) both;
}
dialog::backdrop { background:rgba(0,0,0,.4); backdrop-filter:blur(2px); }
dialog h3 { margin:0 0 2px; font-size:16px; }
dialog .desc { margin:0 0 12px; font-size:14px; color:var(--muted-foreground); }
dialog menu { display:flex; gap:10px; justify-content:flex-end; margin:14px 0 0; padding:0; }
.dl { display:grid; grid-template-columns:76px 1fr; gap:8px 12px; font-size:14px; margin:10px 0; }
.dl dt { color:var(--muted-foreground); }
.dl dd { margin:0; }

/* OCR 流程 */
.ocr-stage { display:flex; flex-direction:column; gap:10px; }
.ocr-step { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); font-size:14px; color:var(--muted-foreground); transition:all .2s var(--ease); }
.ocr-step .st { margin-left:auto; font-size:12px; }
.ocr-step.doing { border-color:var(--primary); color:var(--foreground); }
.ocr-step.done { color:var(--secondary-foreground); }
.ocr-shot { border:2px dashed var(--border); border-radius:var(--radius-lg); padding:36px 12px; text-align:center; color:var(--muted-foreground); cursor:pointer; transition:border-color .15s var(--ease), background .15s var(--ease); }
.ocr-shot:hover { border-color:var(--primary); background:color-mix(in srgb, var(--secondary) 40%, transparent); }

/* Toast */
#toast {
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:#1f2329; color:#fff; padding:10px 18px; border-radius:10px;
  box-shadow:var(--shadow-md); z-index:60; max-width:80vw; font-size:14px;
  display:flex; align-items:center; gap:8px;
  animation:toastIn .2s var(--ease) both;
}
#toast.out { animation:toastOut .18s var(--ease) both; }
#toast.ok { background:#234d33; }
#toast.err { background:var(--destructive); }
#toast.info { background:#2f4858; }

/* 空状态 / 骨架 */
.empty { text-align:center; padding:36px 12px; color:var(--muted-foreground); animation:fadeUp .25s var(--ease) both; }
.empty .icon { font-size:34px; line-height:1; margin-bottom:8px; }
.skel { height:14px; border-radius:6px; margin:12px 6px; background:linear-gradient(90deg,#eceff1 25%,#f6f7f8 50%,#eceff1 75%); background-size:200% 100%; animation:shimmer 1.1s linear infinite; }

/* 登录页 */
#login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
#login-box { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:28px 24px; box-shadow:var(--shadow-lg); animation:fadeUp .25s var(--ease) both; }
#login-box .logo { text-align:center; font-size:34px; margin-bottom:6px; }
#login-box h1 { text-align:center; font-size:20px; margin:0 0 4px; }
#login-box .tagline { text-align:center; font-size:13px; color:var(--muted-foreground); margin-bottom:20px; }
.demo-hint { font-size:12px; color:var(--muted-foreground); background:var(--muted); border-radius:var(--radius); padding:6px 10px; text-align:center; margin-top:14px; }

.net-worth { display:flex; gap:16px; flex-wrap:wrap; }
.net-worth .item { flex:1; min-width:120px; }

/* 动画 */
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@keyframes dialogIn { from { opacity:0; transform:translateY(4px) scale(.95); } to { opacity:1; transform:none; } }
@keyframes toastIn { from { opacity:0; transform:translate(-50%,12px); } to { opacity:1; transform:translate(-50%,0); } }
@keyframes toastOut { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,12px); } }
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
@keyframes spin { to { transform:rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important; }
  html { scroll-behavior:auto; }
}

/* 窄屏：隐藏顶部导航、显示底部 Tab */
@media (max-width:640px) {
  #topbar { display:none; }
  #tabbar { display:block; }
  main { margin:14px auto 110px; padding:0 10px; }
  .card { padding:14px; }
  .overview { grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .ov-card { padding:10px 12px; }
  .ov-card .num { font-size:18px; }
  .report-grid { grid-template-columns:1fr; }
  .form-row { grid-template-columns:1fr; }
  #toast { bottom:84px; }
}
</style>
</head>
<body>

<!-- 顶部导航（桌面） -->
<header id="topbar" class="hidden">
  <span class="brand" onclick="go('home')">FastLedger</span>
  <nav id="topnav">
    <a data-nav="home" href="#/home">首页</a>
    <a data-nav="report" href="#/report">报表</a>
    <a data-nav="accounts" href="#/accounts">账户</a>
    <a data-nav="budget" href="#/budget">预算</a>
    <a data-nav="profile" href="#/profile">我的</a>
  </nav>
  <span id="whoami"></span>
  <button class="btn ghost" style="padding:5px 12px" onclick="logout()">退出</button>
</header>

<!-- 底部 Tab（移动） -->
<nav id="tabbar" class="hidden">
  <div class="tabs">
    <a data-nav="home" href="#/home"><span class="ico">🏠</span>首页</a>
    <a data-nav="add" href="#/add" class="fab-slot"><span class="fab">＋</span>记一笔</a>
    <a data-nav="report" href="#/report"><span class="ico">📊</span>报表</a>
    <a data-nav="profile" href="#/profile"><span class="ico">👤</span>我的</a>
  </div>
</nav>

<main id="view"></main>

<div id="toast" class="hidden"></div>

<!-- 通用确认对话框 -->
<dialog id="confirm-dlg">
  <h3 id="cd-title"></h3>
  <p class="desc" id="cd-desc"></p>
  <menu>
    <button class="btn ghost" onclick="closeConfirm(false)">取消</button>
    <button class="btn" id="cd-ok">确定</button>
  </menu>
</dialog>

<!-- 交易详情对话框 -->
<dialog id="tx-dlg">
  <h3>交易详情</h3>
  <div id="tx-detail"></div>
  <menu>
    <button class="btn ghost" onclick="document.getElementById('tx-dlg').close()">关闭</button>
    <button class="btn" id="tx-edit">编辑</button>
    <button class="btn danger" id="tx-del">删除</button>
  </menu>
</dialog>

<!-- OCR 确认弹窗 -->
<dialog id="ocr-dlg">
  <h3>确认入账</h3>
  <p class="desc">以下字段由截图识别预填，请核对修改后确认。识别结果不会自动入账。</p>
  <div id="ocr-form"></div>
  <menu>

/* =====================================================================

  tx("income", 1850000, "cmb", "", "c_salary", "十月工资", "直接", "公司发薪", 3);

  tx("transfer", 300000, "cmb", "credit", "", "信用卡还款", "直接", "10 月账单", 5);
  tx("expense", 4550, "credit", "", "c_dinner", "聚餐 AA", "微信", "", 6);
  tx("expense", 6800, "alipay", "", "c_game", "游戏月卡", "支付宝", "", 8);
  tx("expense", 15800, "cmb", "", "c_health", "体检套餐", "支付宝", "", 12);
  tx("income", 12000, "wx", "", "c_interest", "基金分红", "直接", "", 15);
  tx("expense", 8800, "wx", "", "c_taxi", "打车回家", "微信", "暴雨", 18);
  return {
    user: "me", logged: false,

    accounts: [

      { id: "alipay", name: "支付宝", cat: "电子钱包", icon: "🅰️", balance: 108000 },
      { id: "credit", name: "招行信用卡", cat: "信用卡", icon: "💳", balance: -543680 },
      { id: "invest", name: "券商账户", cat: "投资", icon: "📈", balance: 5200000 }
    ],
    categories: [
      { id: "c_food", name: "餐饮", icon: "🍜", children: ["c_lunch", "c_dinner"] },
      { id: "c_lunch", name: "午餐", icon: "🍱", parent: "c_food" },
      { id: "c_dinner", name: "聚餐", icon: "🍻", parent: "c_food" },
      { id: "c_trans", name: "交通", icon: "🚇", children: ["c_bus", "c_taxi"] },
      { id: "c_bus", name: "公交地铁", icon: "🎫", parent: "c_trans" },
      { id: "c_taxi", name: "打车", icon: "🚕", parent: "c_trans" },

      { id: "c_grocery", name: "日用超市", icon: "🧺", parent: "c_shop" },
      { id: "c_cloth", name: "服饰", icon: "👕", parent: "c_shop" },
      { id: "c_live", name: "居住", icon: "🏠", children: ["c_rent"] },
      { id: "c_rent", name: "房租水电", icon: "💡", parent: "c_live" },
      { id: "c_fun", name: "娱乐", icon: "🎬", children: ["c_movie", "c_game"] },
      { id: "c_movie", name: "电影", icon: "🍿", parent: "c_fun" },
      { id: "c_game", name: "游戏", icon: "🎮", parent: "c_fun" },
      { id: "c_health", name: "医疗健康", icon: "🩺", children: [] },

      { id: "c_salary", name: "工资", icon: "💰", parent: "c_work" },
      { id: "c_fi", name: "理财收益", icon: "📊", children: ["c_interest"] },
      { id: "c_interest", name: "利息分红", icon: "🪙", parent: "c_fi" }
    ],
    budgets: [
      { categoryId: "c_food", amount: 150000 },
      { categoryId: "c_shop", amount: 80000 },
      { categoryId: "c_trans", amount: 40000 },
      { categoryId: "c_fun", amount: 30000 }
    ],
    totalBudget: 300000,
    members: [
      { name: "me", role: "owner", note: "我（户主）" },

  };
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { return JSON.parse(raw); }
  } catch (e) { /* 隐私模式等场景回退内存态 */ }
  var s = seedState();
  save(s);
  return s;
}
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
var S = load();

/* ---------- 工具 ---------- */
function fmt(cents) {
  var neg = cents < 0, v = Math.abs(cents);
  var s = (v / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + s;
}
function acct(id) { return S.accounts.find(function (a) { return a.id === id; }) || { name: "?", icon: "❓", cat: "", balance: 0 }; }
function cat(id) { return S.categories.find(function (c) { return c.id === id; }) || null; }
function catColor(id) {
  var top = cat(id);
  while (top && top.parent) { top = cat(top.parent); }
  var names = S.categories.filter(function (c) { return !c.parent; });
  var idx = names.indexOf(top);
  return CAT_PALETTE[(idx < 0 ? 0 : idx) % CAT_PALETTE.length];
}
function catLabel(id) {
  var c = cat(id); if (!c) return "未分类";
  return c.parent ? (cat(c.parent) ? cat(c.parent).name + " · " + c.name : c.name) : c.name;
}
function monthSpend(mkey) {
  var o = { expense: 0, income: 0 };
  S.transactions.forEach(function (t) {
    if (monthKey(t.time) !== mkey) return;
    if (t.type === "expense") o.expense += t.amount;
    if (t.type === "income") o.income += t.amount;
  });
  return o;
}
function catSpendMonth(catId, mkey) {
  var ids = [catId].concat((cat(catId) && cat(catId).children) || []);
  var sum = 0;
  S.transactions.forEach(function (t) {
    if (t.type === "expense" && monthKey(t.time) === mkey && ids.indexOf(t.categoryId) >= 0) sum += t.amount;
  });
  return sum;
}
function netWorth() {
  return S.accounts.reduce(function (n, a) { return n + a.balance; }, 0);
}
function recalcBalances() {
  // 余额 = 种子期初 + 交易流；演示数据直接以 seed balance 为期初重算
  var seed = seedState();
  S.accounts.forEach(function (a) {
    var s = seed.accounts.find(function (x) { return x.id === a.id; });
    var base = s ? s.balance : 0;
    S.transactions.forEach(function (t) {
      if (t.type === "expense" && t.accountId === a.id) base -= t.amount;
      if (t.type === "income" && t.accountId === a.id) base += t.amount;
      if (t.type === "transfer") {
        if (t.accountId === a.id) base -= t.amount;
        if (t.toAccountId === a.id) base += t.amount;
      }
    });
    a.balance = base;
  });
}

/* =====================================================================
 * UI 基础件：toast / 确认框 / 路由
 * ===================================================================*/
var toastTimer = null;
function toast(msg, kind) {
  var el = document.getElementById("toast");
  el.className = kind || "info";
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    el.className = (kind || "info") + " out";
    setTimeout(function () { el.className = "hidden"; }, 200);
  }, 2200);
}
var confirmCb = null;
function confirmDlg(title, desc, okText, danger, cb) {
  document.getElementById("cd-title").textContent = title;
  document.getElementById("cd-desc").textContent = desc;
  var ok = document.getElementById("cd-ok");
  ok.textContent = okText || "确定";
  ok.className = danger ? "btn danger" : "btn";
  confirmCb = cb;
  document.getElementById("confirm-dlg").showModal();
}
function closeConfirm(v) {
  document.getElementById("confirm-dlg").close();
  if (confirmCb) { var cb = confirmCb; confirmCb = null; if (v) cb(); }
}
document.getElementById("cd-ok").addEventListener("click", function () { closeConfirm(true); });

var currentCat = null; // 编辑中的交易
function showTx(id) {
  var t = S.transactions.find(function (x) { return x.id === id; });
  if (!t) return;
  currentCat = t;
  var a = acct(t.accountId), to = t.toAccountId ? acct(t.toAccountId) : null;
  var amtCls = t.type === "income" ? "income" : t.type === "expense" ? "expense" : "transfer";
  var sign = t.type === "income" ? "+" : t.type === "expense" ? "-" : "";
  var html = "<dl class='dl'>" +
    "<dt>类型</dt><dd><span class='badge " + amtCls + "'>" + typeName(t.type) + "</span></dd>" +
    "<dt>金额</dt><dd class='tx-amount " + amtCls + "' style='text-align:left'>" + sign + "¥" + fmt(t.amount) + "</dd>" +
    "<dt>分类</dt><dd>" + (t.categoryId ? catLabel(t.categoryId) : "—") + "</dd>" +
    "<dt>" + (t.type === "transfer" ? "转出账户" : "账户") + "</dt><dd>" + a.icon + " " + a.name + "</dd>" +
    (to ? "<dt>转入账户</dt><dd>" + to.icon + " " + to.name + "</dd>" : "") +
    "<dt>支付渠道</dt><dd>" + (t.channel || "—") + "</dd>" +
    "<dt>商户/备注</dt><dd>" + ((t.merchant || "") + (t.note ? "（" + t.note + "）" : "")) + "</dd>" +
    "<dt>时间</dt><dd>" + t.time + "</dd>" +
    "</dl>";
  document.getElementById("tx-detail").innerHTML = html;
  document.getElementById("tx-dlg").showModal();
}
document.getElementById("tx-del").addEventListener("click", function () {
  if (!currentCat) return;
  var t = currentCat;
  document.getElementById("tx-dlg").close();
  confirmDlg("删除交易", "删除后「" + acct(t.accountId).name + "」" +
    (t.toAccountId ? "与「" + acct(t.toAccountId).name + "」" : "") + "余额将联动回滚，可在回收站 30 天内恢复。",
    "删除", true, function () {
      S.transactions = S.transactions.filter(function (x) { return x.id !== t.id; });
      recalcBalances(); save(S);
      toast("已删除，余额已回滚", "ok");
      render();
    });
});
document.getElementById("tx-edit").addEventListener("click", function () {
  if (!currentCat) return;
  document.getElementById("tx-dlg").close();
  location.hash = "#/add?edit=" + currentCat.id;
});

function typeName(ty) { return ty === "income" ? "收入" : ty === "expense" ? "支出" : "转账"; }
function go(page) { location.hash = "#/" + page; }
function logout() {
  S.logged = false; save(S);
  document.getElementById("topbar").classList.add("hidden");
  document.getElementById("tabbar").classList.add("hidden");
  go("login");
}
function enterApp() {
  S.logged = true; save(S);
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("tabbar").classList.remove("hidden");
  go("home");
}

/* =====================================================================
 * 页面渲染
 * ===================================================================*/
var view = document.getElementById("view");
var editing = null; // 记一笔：编辑模式
var homeFilter = "all";
var reportOffset = 0; // 报表月份偏移

var PAGES = ["home", "add", "ocr", "report", "accounts", "categories", "budget", "profile", "members", "export", "settings", "login"];

function route() {
  var raw = (location.hash || "#/home").replace(/^#\//, "") || "home";
  var qm = raw.indexOf("?");
  var name = qm >= 0 ? raw.slice(0, qm) : raw;
  if (PAGES.indexOf(name) < 0) name = "home";
  if (!S.logged && name !== "login") { name = "login"; }
  if (S.logged && name === "login") { name = "home"; }
  // 编辑态经 hash 参数传递：#/add?edit=<txId>
  editing = null;
  if (name === "add" && qm >= 0) {
    var eid = raw.slice(qm + 1).replace(/^edit=/, "");
    editing = S.transactions.find(function (x) { return x.id === eid; }) || null;
  }
  document.querySelectorAll("[data-nav]").forEach(function (a) {
    a.classList.toggle("active", a.getAttribute("data-nav") === name);
  });
  render(name);
}
window.addEventListener("hashchange", route);

function render(name) {
  var R = { login: pLogin, home: pHome, add: pAdd, ocr: pOcr, report: pReport, accounts: pAccounts,
            categories: pCategories, budget: pBudget, profile: pProfile, members: pMembers,
            export: pExport, settings: pSettings };
  view.innerHTML = "";
  (R[name] || pHome)();
  document.getElementById("whoami").textContent = S.logged ? "@" + S.user : "";
}

/* ---------- 登录 ---------- */
function pLogin() {
  view.innerHTML =
    "<div id='login-wrap'><div id='login-box'>" +
    "<div class='logo'>📒</div><h1>FastLedger</h1>" +
    "<p class='tagline'>自托管家庭智能记账 · 数据在自己手里</p>" +

    "<div class='err-msg' id='li-err'></div>" +

    "</div></div>";
  document.getElementById("li-btn").addEventListener("click", function () {

/* ---------- 首页 ---------- */
function pHome() {
  view.innerHTML = "<div class='skel' style='width:60%'></div><div class='skel' style='width:90%'></div><div class='skel' style='width:75%'></div>";
  setTimeout(function () {
    var mk = monthKey(todayStr());
    var ms = monthSpend(mk);
    var list = S.transactions.slice().sort(function (a, b) { return b.time < a.time ? -1 : b.time > a.time ? 1 : 0; });
    if (homeFilter !== "all") { list = list.filter(function (t) { return t.type === homeFilter; }); }
    var html =
      "<div class='overview'>" +
      "<div class='ov-card'><div class='label'>本月支出</div><div class='num' style='color:var(--expense)'><small>¥</small>" + fmt(ms.expense) + "</div></div>" +
      "<div class='ov-card'><div class='label'>本月收入</div><div class='num' style='color:var(--income)'><small>¥</small>" + fmt(ms.income) + "</div></div>" +
      "<div class='ov-card'><div class='label'>本月结余</div><div class='num'><small>¥</small>" + fmt(ms.income - ms.expense) + "</div></div>" +
      "</div>" +
      "<div class='card'>" +
      "<h2>账单<span class='sub'>家庭公共账 · 共 " + list.length + " 笔</span></h2>" +
      "<div class='chips'>" +
      chip("all", "全部") + chip("expense", "支出") + chip("income", "收入") + chip("transfer", "转账") +
      "<button class='chip' style='margin-left:auto' onclick=\"go('ocr')\">📷 截图识别</button>" +
      "<button class='chip' onclick=\"go('add')\">✏️ 手动记</button>" +
      "</div><div id='tx-list'>";
    if (!list.length) {
      html += "<div class='empty'><div class='icon'>🍃</div><p>本月还没有符合条件的记录</p></div>";
    }
    var lastDay = "";
    var daySum = 0;
    list.forEach(function (t) {
      if (t.time !== lastDay) {
        if (lastDay) { html += "<div class='day-head'><span></span><span>小计 ¥" + fmt(daySum) + "</span></div>"; }
        lastDay = t.time; daySum = 0;
        html += "<div class='day-head'><span>" + t.time + "</span></div>";
      }
      var a = acct(t.accountId), c = t.categoryId ? cat(t.categoryId) : null;
      var col = t.categoryId ? catColor(t.categoryId) : { bg: "#f2f3f5", fg: "#8f959e" };
      var cls = t.type === "income" ? "income" : t.type === "expense" ? "expense" : "transfer";
      var sign = t.type === "income" ? "+" : t.type === "expense" ? "-" : "";
      if (t.type !== "transfer") daySum += (t.type === "expense" ? t.amount : -t.amount);
      html += "<div class='tx-row' onclick=\"showTx('" + t.id + "')\">" +
        "<div class='cat-ico' style='background:" + col.bg + ";color:" + col.fg + "'>" + (c ? c.icon : "🔁") + "</div>" +
        "<div class='tx-main'><div class='tx-title'>" + (t.merchant || catLabel(t.categoryId) || typeName(t.type)) + "</div>" +
        "<div class='tx-sub'>" + a.name + " · " + (t.channel || "直接") + (t.note ? " · " + t.note : "") + "</div></div>" +
        "<div class='tx-amount " + cls + "'>" + sign + "¥" + fmt(t.amount) + "</div></div>";
    });
    if (lastDay) { html += "<div class='day-head'><span></span><span>小计 ¥" + fmt(daySum) + "</span></div>"; }
    html += "</div></div>";
    view.innerHTML = html;
  }, 260);
}
function chip(v, label) {
  return "<button class='chip" + (homeFilter === v ? " on" : "") + "' onclick=\"homeFilter='" + v + "';pHome()\">" + label + "</button>";
}

    (ty === "transfer"
      ? "<div class='form-row'>" +
        "<div class='field'><label>转出账户</label><select id='f-from'>" + opts(t.accountId) + "</select></div>" +

        "<div class='err-msg' id='e-to'></div>"

/* ---------- 报表 ---------- */
function pReport() {
  var base = new Date(); base.setDate(1);
  base.setMonth(base.getMonth() + reportOffset);
  var mk = base.toISOString().slice(0, 7);
  var ms = monthSpend(mk);
  // 近 6 月趋势（相对当前选中月向前）
  var bars = [];
  for (var i = 5; i >= 0; i--) {
    var d = new Date(base); d.setMonth(d.getMonth() - i);
    var k = d.toISOString().slice(0, 7);
    var m = monthSpend(k);
    bars.push({ k: k, e: m.expense, i: m.income });
  }
  var maxV = Math.max.apply(null, bars.map(function (b) { return Math.max(b.e, b.i, 1); }));
  // 分类占比
  var byCat = {};
  S.transactions.forEach(function (t) {
    if (t.type !== "expense" || monthKey(t.time) !== mk) return;
    var top = t.categoryId ? cat(t.categoryId) : null;
    while (top && top.parent) { top = cat(top.parent); }
    var key = top ? top.id : "other";
    byCat[key] = (byCat[key] || 0) + t.amount;
  });
  var pairs = Object.keys(byCat).map(function (k) { return { id: k, v: byCat[k] }; })
    .sort(function (a, b) { return b.v - a.v; });
  var totalE = pairs.reduce(function (n, p) { return n + p.v; }, 0);
  var acc = 0, stops = [];
  var CHART5 = ["#34b262", "#34b2a1", "#3484b2", "#3444b2", "#6234b2", "#bbbfc4"];
  var legend = "";
  pairs.forEach(function (p, idx) {
    var c = CHART5[Math.min(idx, 5)];
    var from = acc / (totalE || 1) * 100; acc += p.v;
    var to = acc / (totalE || 1) * 100;
    stops.push(c + " " + from.toFixed(1) + "% " + to.toFixed(1) + "%");
    legend += "<div class='li'><span class='dot' style='background:" + c + "'></span>" +
      (cat(p.id) ? cat(p.id).name : "其他") + "<span class='v'>¥" + fmt(p.v) + " · " + Math.round(p.v / (totalE || 1) * 100) + "%</span></div>";
  });
  if (!pairs.length) { legend = "<div class='empty' style='padding:20px'><div class='icon'>📊</div><p>本月暂无支出</p></div>"; }
  view.innerHTML =
    "<h1 class='page-title'>报表</h1>" +
    "<div class='card'>" +
    "<div class='month-nav'><button onclick=\"reportOffset--;pReport()\">‹</button>" +
    "<b>" + mk + "</b><button onclick=\"reportOffset++;pReport()\">›</button>" +
    "<span class='badge' style='margin-left:auto'>支出 ¥" + fmt(ms.expense) + " · 收入 ¥" + fmt(ms.income) + "</span></div>" +
    "<div class='bars'>" +
    bars.map(function (b) {
      return "<div class='bar-col'><div class='bar-pair'>" +
        "<div class='bar in' style='height:" + Math.round(b.i / maxV * 100) + "%' title='收入 ¥" + fmt(b.i) + "'></div>" +
        "<div class='bar' style='height:" + Math.round(b.e / maxV * 100) + "%' title='支出 ¥" + fmt(b.e) + "'></div>" +
        "</div><span class='bar-x'>" + b.k.slice(5) + "</span></div>";
    }).join("") +
    "</div><div style='display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted-foreground);margin-top:8px'>" +
    "<span><span class='dot' style='display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--chart-3)'></span> 收入</span>" +
    "<span><span class='dot' style='display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--chart-1)'></span> 支出</span></div></div>" +
    "<div class='card'><h2>支出分类占比</h2>" +
    "<div class='donut-wrap'>" +
    (pairs.length ? "<div class='donut' style='background:conic-gradient(" + stops.join(",") + ")'></div>" : "") +
    "<div class='legend'>" + legend + "</div></div></div>";
}

    var rows = list.slice(0, 5).map(function (t) {
      return "<tr><td>" + t.time + "</td><td>" + typeName(t.type) + "</td><td>" + (t.merchant || "—") + "</td><td class='num'>¥" + fmt(t.amount) + "</td></tr>";
    }).join("");
    document.getElementById("x-prev").innerHTML =
      "<div class='privacy-note' style='margin:0 0 10px'>共 " + list.length + " 条命中，预览前 5 条：</div>" +
      "<table><thead><tr><th>日期</th><th>类型</th><th>商户</th><th style='text-align:right'>金额</th></tr></thead><tbody>" + rows + "</tbody></table>";
    toast("已生成 " + document.getElementById("x-fmt").value.split("（")[0] + " 文件（演示）", "ok");
  });
}

/* ---------- 设置 ---------- */
function pSettings() {
  view.innerHTML =
    "<h1 class='page-title'>设置</h1>" +
    "<div class='card'><h2>个人资料</h2>" +
    "<div class='form-row'><div class='field'><label>用户名</label><input type='text' value='me' disabled></div>" +
    "<div class='field'><label>昵称</label><input type='text' value='户主'></div></div></div>" +
    "<div class='card'><h2>API Token<span class='sub'>长期令牌 · 用后请撤销</span></h2>" +
    "<div id='tok-box'><div class='privacy-note' style='margin:0'>尚未生成 Token</div></div>" +
    "<div style='display:flex;gap:10px;margin-top:12px'>" +
    "<button class='btn ghost' id='tok-gen'>生成</button>" +
    "<button class='btn ghost' id='tok-copy' disabled>复制</button>" +
    "<button class='btn danger' id='tok-rev' disabled>撤销</button></div></div>" +
    "<div class='card'><h2>服务器与备份</h2>" +
    "<div class='tx-row' style='cursor:default'><div class='tx-main'><div class='tx-title'>实例状态</div><div class='tx-sub'>自托管 · SQLite · schema v7</div></div><span class='badge'>运行中</span></div>" +
    "<div class='tx-row' style='cursor:default'><div class='tx-main'><div class='tx-title'>每日备份</div><div class='tx-sub'>滚动保留最近 7 份 · 恢复演练通过</div></div><span class='badge'>已启用</span></div></div>" +
    "<button class='btn danger block' onclick=\"logout()\">退出登录</button>";
  var tok = "";
  document.getElementById("tok-gen").addEventListener("click", function () {
    tok = "flk_" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    document.getElementById("tok-box").innerHTML =
      "<div class='privacy-note' style='margin:0;font-family:monospace'>" + tok + "</div>";
    document.getElementById("tok-copy").disabled = false;
    document.getElementById("tok-rev").disabled = false;
    toast("Token 已生成，请立即复制保存", "ok");
  });
  document.getElementById("tok-copy").addEventListener("click", function () {
    if (tok && navigator.clipboard) { navigator.clipboard.writeText(tok); }
    toast("已复制到剪贴板", "ok");
  });
  document.getElementById("tok-rev").addEventListener("click", function () {
    confirmDlg("撤销 Token", "使用该 Token 的客户端将被登出（会话撤销，WebSocket 同步断开）。", "撤销", true, function () {
      tok = "";
      document.getElementById("tok-box").innerHTML = "<div class='privacy-note' style='margin:0'>尚未生成 Token</div>";
      document.getElementById("tok-copy").disabled = true;
      document.getElementById("tok-rev").disabled = true;
      toast("Token 已撤销", "ok");
    });
  });
}

route();
</script>
